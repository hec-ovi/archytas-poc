services:
  api:
    build: ./backend
    ports:
      - "8100:8000"
    env_file:
      - .env
    environment:
      CORDILLERA_DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./backend:/app
    extra_hosts:
      # the agent talks to the llama.cpp server running on the host
      - "host.docker.internal:host-gateway"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./web
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      VITE_API_BASE: http://localhost:8100
    depends_on:
      - api
